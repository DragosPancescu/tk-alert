[project]
name = "tk-alert"
version = "0.0.2"
description = "Tkinter based package for sending GUI alerts / notifications."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE.txt", "notices.md"]
authors = [{ name = "Dragos Pancescu", email = "dragos.pnc@gmail.com" }]
keywords = ["tkinter", "alert", "notification", "gui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DragosPancescu/tk-alert"
Issues = "https://github.com/DragosPancescu/tk-alert/issues"

[dependency-groups]
dev = ["pytest>=7.4"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
# pytest's default fd-level capture makes Tk's `image create photo -file ...`
# fail intermittently on Windows (empty TclError), so capture at sys level.
addopts = "--capture=sys"
